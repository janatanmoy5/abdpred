name: ABDpred prediction

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build prediction environment
        run: docker build --platform linux/amd64 -t abdpred .
      - name: Check offline predictions
        run: |
          docker run --rm abdpred --csv models/example.csv > predictions.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("predictions.json").read_text())
          assert len(results) == 5
          for row in results:
              assert set(row["models"]) == {"XGB", "RF", "GBC", "DNN"}
              probabilities = [model["antibiotic_probability"] for model in row["models"].values()]
              assert all(0 <= value <= 1 for value in probabilities)
              assert abs(row["consensus"]["antibiotic_probability"] - sum(probabilities) / 4) < 1e-12
          PY
      - name: Check browser launch
        run: |
          docker run -d --name abdpred -e PORT=10000 -p 127.0.0.1:8765:10000 abdpred
          trap 'docker logs abdpred; docker rm -f abdpred' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8765/healthz -o health.txt
          grep -qx ok health.txt
          curl --fail --silent --show-error http://127.0.0.1:8765/ -o page.html
          grep -q 'name="cid"' page.html
          status=$(curl --silent --output error.html --write-out '%{http_code}' \
            --data 'cid=invalid' http://127.0.0.1:8765/)
          test "$status" = 400
          grep -q 'Enter a positive numeric PubChem CID' error.html
